name: Build ATLAS Alarm and Alert Frontend image

on:
  push:
    branches:
      - "full_rewrite"
    tags:
      - "*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ivukotic/aaasf:${{ github.ref_name }}
            ivukotic/aaasf:${{ steps.vars.outputs.short_sha }}

      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.AAAS_GITOPS_DEPLOY_TRIGGER }}
        run: |
          gh api repos/maniaclab/flux_apps/dispatches \
            -f event_type=gitops-aaasf-app-trigger-dev \
            -f "client_payload[ref]=${{ github.ref_name }}" \
            -f "client_payload[short_sha]=${{ steps.vars.outputs.short_sha }}"
